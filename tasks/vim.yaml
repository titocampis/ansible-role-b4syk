- name: Vim | Configure vimrc on root and {{ b4syk_main_user }}
  ansible.builtin.template:
    src: vimrc.j2
    dest: "{{ item.path }}"
    owner: "{{ item.owner }}"
    group: "{{ item.owner }}"
    mode: "0644"
  with_items:
    - path: "/root/.vimrc"
      owner: "root"
    - path: "/home/{{ b4syk_main_user }}/.vimrc"
      owner: "{{ b4syk_main_user }}"
